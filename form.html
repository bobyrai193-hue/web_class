 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete HTML Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input:not([type="radio"]):not([type="checkbox"]):not([type="color"]):not([type="range"]),
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin: 10px 5px 0 0;
        }

        input[type="color"] {
            margin-top: 7px;
        }

        input[type="range"] {
            margin-top: 10px;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            min-width: 90px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .submit { background: #28a745; }
        .reset { background: #ffc107; color: black; }
        .cancel { background: #dc3545; }
        .normal { background: #007bff; }

        button:hover {
            opacity: 0.8;
        }

        #result {
            margin-top: 15px;
            color: green;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Registration Form</h2>

    <form id="myForm">

        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname"
               placeholder="Enter your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Enter password" minlength="6" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter phone number">

        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="1" max="120">

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob">

        <label for="time">Preferred Time</label>
        <input type="time" id="time" name="time">

        <label for="website">Website</label>
        <input type="url" id="website" name="website"
               placeholder="https://example.com">

        <label for="search">Search</label>
        <input type="search" id="search" placeholder="Search here">

        <label>Gender</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other

        <label for="country">Country</label>
        <select id="country" name="country">
            <option value="">Select country</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
            <option value="Canada">Canada</option>
        </select>

        <label>Skills</label>
        <input type="checkbox" name="skills" value="HTML"> HTML
        <input type="checkbox" name="skills" value="CSS"> CSS
        <input type="checkbox" name="skills" value="JavaScript"> JavaScript

        <label for="color">Choose Color</label>
        <input type="color" id="color" name="color" value="#007bff">

        <label for="range">Satisfaction Level</label>
        <input type="range" id="range" name="satisfaction"
               min="0" max="100" value="50">

        <label for="file">Upload File</label>
        <input type="file" id="file" name="file">

        <label for="message">Message</label>
        <textarea id="message" name="message"
                  placeholder="Write your message"></textarea>

        <label>
            <input type="checkbox" name="terms" required>
            I agree to the terms and conditions
        </label>

        <div class="buttons">
            <button type="submit" class="submit">Submit</button>
            <button type="reset" class="reset">Reset</button>
            <button type="button" class="cancel"
                    onclick="cancelForm()">Cancel</button>
            <button type="button" class="normal"
                    onclick="showData()">Preview</button>
        </div>

        <p id="result" aria-live="polite"></p>
    </form>
</div>

<script>
    const form = document.getElementById("myForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        if (!form.reportValidity()) return;

        result.textContent = "Form submitted successfully!";
    });

    function cancelForm() {
        if (confirm("Do you want to clear the form?")) {
            form.reset();
            result.textContent = "";
        }
    }

    function showData() {
        if (!form.reportValidity()) return;

        const name = document.getElementById("fullname").value;
        result.textContent = "Preview: Hello, " + name + "!";
    }

    form.addEventListener("reset", function() {
        result.textContent = "";
    });
</script>

</body>
</html>
